      var dObj = targetEdge ? (DIRS.find(function(d) { return d.key === targetEdge.dir; }) || DIRS[0]) : DIRS[0];

      var sideSel = document.createElement('select');
      sideSel.className = 'ext-select ext-side-sel';

      var optEnd = document.createElement('option');
      optEnd.value = 'end';
      optEnd.textContent = '終点(' + dObj.label + ')';
      if (ext.side === 'end') optEnd.selected = true;
      sideSel.appendChild(optEnd);

      var optStart = document.createElement('option');
      optStart.value = 'start';
      optStart.textContent = '始点(' + dObj.opp + ')';
      if (ext.side === 'start') optStart.selected = true;
      sideSel.appendChild(optStart);

      sideSel.addEventListener('change', function(e) { updateExtension(extIdx, 'side', e.target.value); });
      row.appendChild(sideSel);

      var distInp = document.createElement('input');
      distInp.type = 'number';
      distInp.inputMode = 'decimal';
      distInp.min = '0';
      distInp.step = '0.001';
      distInp.placeholder = '離れ(m)';
      distInp.className = 'ext-dist-inp';
      distInp.value = ext.dist;
      selectAllOnFocus(distInp);
      distInp.addEventListener('input', function(e) { updateExtension(extIdx, 'dist', e.target.value); });
      row.appendChild(distInp);

      var delBtn = document.createElement('button');
      delBtn.type = 'button';
      delBtn.className = 'del-btn';
      delBtn.style.height = '38px';
      delBtn.textContent = '×';
      delBtn.addEventListener('click', function() { removeExtension(extIdx); });
      row.appendChild(delBtn);

      extListEl.appendChild(row);
    });

    // 5. 種類・構造・屋根の区分リスト
    var secListEl = document.getElementById('secList');
    secListEl.innerHTML = '';
    curBldg.sections.forEach(function(sec, sIdx) {
      var color = SEC_COLORS[sIdx % SEC_COLORS.length];
      var box = document.createElement('div');
      box.className = 'sec-box';
      box.style.borderLeftColor = color;

      var topRow = document.createElement('div');
      topRow.className = 'sec-top';

      var pill = document.createElement('span');
      pill.className = 'sec-pill';
      pill.style.background = color;
      pill.textContent = (CIRCLED_NUMS[sIdx] || (sIdx + 1)) + ' 部分';
      topRow.appendChild(pill);

      var noteInp = document.createElement('input');
      noteInp.type = 'text';
      noteInp.className = 'sec-note-inp';
      noteInp.placeholder = sIdx === 0 ? '場所メモ（例：既存主屋）' : '場所メモ（例：北側増築部・下屋）';
      noteInp.value = sec.note;
      noteInp.addEventListener('input', function(e) { updateSection(sIdx, 'note', e.target.value); });
      topRow.appendChild(noteInp);

      if (curBldg.sections.length > 1) {
        var delSec = document.createElement('button');
        delSec.type = 'button';
        delSec.className = 'del-btn';
        delSec.style.height = '32px';
        delSec.style.width = '30px';
        delSec.textContent = '×';
        delSec.addEventListener('click', function() { removeSection(secIdx); });
        topRow.appendChild(delSec);
      }
      box.appendChild(topRow);

      var grid = document.createElement('div');
      grid.className = 'sec-grid';

      var fields = [
        { key: 'kind', label: '種類', list: 'listKind', ph: '居宅' },
        { key: 'structure', label: '構造', list: 'listStruct', ph: '木造' },
        { key: 'roof', label: '屋根の種類', list: 'listRoof', ph: 'かわらぶき' }
      ];
      fields.forEach(function(f) {
        var fDiv = document.createElement('div');
        fDiv.className = 'sec-field';
        var lbl = document.createElement('label');
        lbl.textContent = f.label;
        var inp = document.createElement('input');
        inp.type = 'text';
        inp.setAttribute('list', f.list);
        inp.placeholder = f.ph;
        inp.value = sec[f.key];
        inp.addEventListener('input', function(e) { updateSection(sIdx, f.key, e.target.value); });
        fDiv.appendChild(lbl);
        fDiv.appendChild(inp);
        grid.appendChild(fDiv);
      });

      box.appendChild(grid);
      secListEl.appendChild(box);
    });

    calculateAndDraw();
  }

  function computeExtensions(curFloor, activePts, isCenter, halfWallM) {
    var results = [];
    var addOffset = isCenter ? halfWallM : 0;

    curFloor.extensions.forEach(function(ext) {
      var rawDist = parseFloat(ext.dist);
      if (isNaN(rawDist) || rawDist < 0) return;

      var eIdx = ext.edgeIdx;
      var edge = curFloor.edges[eIdx];
      if (!edge || !activePts[eIdx] || !activePts[eIdx + 1]) return;

      var pStart = activePts[eIdx];
      var pEnd = activePts[eIdx + 1];

      var vx = pEnd.x - pStart.x;
      var vy = pEnd.y - pStart.y;
      var len = Math.hypot(vx, vy);
      var ux, uy;
      if (len > 1e-6) {
        ux = vx / len;
        uy = vy / len;
      } else {
        var dObj = DIRS.find(function(d) { return d.key === edge.dir; }) || DIRS[0];
        ux = dObj.dx;
        uy = dObj.dy;
      }

      var actualDist = rawDist + addOffset;
      var basePt = (ext.side === 'end') ? pEnd : pStart;
      var dirSign = (ext.side === 'end') ? 1 : -1;

      results.push({
        edgeNum: eIdx + 1,
        basePt: basePt,
        ux: ux * dirSign,
        uy: uy * dirSign,
        dist: actualDist
      });
    });

    return results;
  }

  function calculateAndDraw() {
    var curBldg = getCurBldg();
    var wallThickMm = Math.max(0, parseFloat(curBldg.wallThickness) || 0);
    var halfWallM = (wallThickMm / 2) / 1000.0;
    document.getElementById('halfWallDisplay').value = (wallThickMm / 2).toFixed(1) + ' mm (' + halfWallM.toFixed(4) + ' m)';

    var isCenter = (viewMode === 'center');
    var badge = document.getElementById('modeBadge');
    badge.textContent = isCenter ? '● 壁芯(青破線:実測)' : '● 実測(外法)';
    badge.style.color = isCenter ? 'var(--accent)' : 'var(--primary)';

    var bldgTotalFlooredArea = 0;
    var numSections = curBldg.sections.length;
    var splitMode = curBldg.splitMode || 'straight';
    var bldgSecFlooredAreas = [];
    var bldgSecRawAreas = [];
    for (var s = 0; s < numSections; s++) {
      bldgSecFlooredAreas.push(0);
      bldgSecRawAreas.push(0);
    }

    var currentFloorData = null;
    var firstFloorData = null;

    curBldg.floors.forEach(function(f, idx) {
      var outer = computeOuterPoints(f.edges);
      var centerPts = computeOffsetPolygon(outer.pts, halfWallM, f.edges, outer.isClosed);
      var activePts = isCenter ? centerPts : outer.pts;
      var rawArea = calcArea(activePts);
      var flooredArea = floorArea2(rawArea);
      bldgTotalFlooredArea = Math.round((bldgTotalFlooredArea + flooredArea) * 100) / 100;

      var secRes = computeSectionAreasAndBridges(activePts, f.edges, numSections, splitMode);
      var floorSecAreas = secRes.areas;
      for (var s = 0; s < numSections; s++) {
        bldgSecRawAreas[s] += floorSecAreas[s];
        bldgSecFlooredAreas[s] = Math.round((bldgSecFlooredAreas[s] + floorArea2(floorSecAreas[s])) * 100) / 100;
      }

      var extLines = computeExtensions(f, activePts, isCenter, halfWallM);
      var data = {
        outer: outer,
        centerPts: centerPts,
        activePts: activePts,
        rawArea: rawArea,
        area: flooredArea,
        secAreas: floorSecAreas,
        bridges: secRes.bridges,
        extLines: extLines,
        name: f.name,
        edges: f.edges
      };
      if (idx === 0) firstFloorData = data;
      if (idx === currentFloorIdx) currentFloorData = data;
    });

    // エラー行のハイライト更新
    var errMap = currentFloorData.outer.geomCheck.errorEdgeIndices;
    currentFloorData.edges.forEach(function(_, idx) {
      var rowEl = document.getElementById('edgeRow_' + idx);
      if (rowEl) {
        rowEl.classList.toggle('edge-error', !!errMap[idx]);
      }
    });

    var banner = document.getElementById('closureBanner');
    var err = currentFloorData.outer.closureErr;
    var hasInput = currentFloorData.outer.totalLen > 0.001;
    var geomCheck = currentFloorData.outer.geomCheck;

    if (!hasInput) {
      banner.className = 'closure-banner closure-empty';
      banner.innerHTML = '<span>辺長未入力</span><span>-</span>';
    } else if (geomCheck.hasError) {
      banner.className = 'closure-banner closure-ng';
      var reason = geomCheck.hasFoldBack ? '辺が180度折り返し重複しています' : '辺同士が交差（ねじれ）しています';
      banner.innerHTML = '<span>⚠ 形状エラー: ' + reason + '</span><span>方向を確認</span>';
    } else if (currentFloorData.outer.isClosed) {
      banner.className = 'closure-banner closure-ok';
      banner.innerHTML = '<span>✔ 閉合 OK</span><span>誤差: ' + err.toFixed(3) + ' m</span>';
    } else {
      banner.className = 'closure-banner closure-ng';
      var remX = (-currentFloorData.outer.dx).toFixed(3);
      var remY = (-currentFloorData.outer.dy).toFixed(3);
      banner.innerHTML =
        '<span>⚠ 未閉合（残 X:' + remX + ' / Y:' + remY + 'm）</span>' +
        '<button type="button" id="btnAutoCloseNow" class="btn-auto-close">不足分を自動閉合</button>';
      var autoBtn = document.getElementById('btnAutoCloseNow');
      if (autoBtn) {
        autoBtn.addEventListener('click', autoCloseCurrentFloor);
      }
    }

    var modeText = isCenter ? '壁芯' : '実測';
    var warnTag = '';
    if (hasInput && geomCheck.hasError) warnTag = ' ※形状エラー要修正';
    else if (hasInput && !currentFloorData.outer.isClosed) warnTag = ' ※未閉合参考値';

    document.getElementById('floorAreaLabel').textContent = currentFloorData.name + ' 床面積（' + modeText + '）';
    document.getElementById('floorAreaVal').textContent = currentFloorData.area.toFixed(2) + ' ㎡ (' + (currentFloorData.area * 0.3025).toFixed(2) + '坪)';
    document.getElementById('floorAreaSub').textContent = '端数切捨前: ' + currentFloorData.rawArea.toFixed(4) + ' ㎡' + warnTag;

    document.getElementById('totalAreaLabel').textContent = curBldg.label + ' 総面積（全' + curBldg.floors.length + '階）';
    document.getElementById('totalAreaVal').textContent = bldgTotalFlooredArea.toFixed(2) + ' ㎡ (' + (bldgTotalFlooredArea * 0.3025).toFixed(2) + '坪)';

    // キャンバス上部凡例バーの更新（複数区分時）
    var legendEl = document.getElementById('canvasLegend');
    if (numSections > 1) {
      legendEl.style.display = 'flex';
      legendEl.innerHTML = curBldg.sections.map(function(sec, sIdx) {
        var col = SEC_COLORS[sIdx % SEC_COLORS.length];
        var numB = CIRCLED_NUMS[sIdx] || (sIdx + 1);
        var labelTxt = (sec.roof || sec.structure || '未設定') + (sec.note ? '(' + sec.note + ')' : '');
        return '<span class="legend-chip" style="background:' + col + ';">' + numB + ' ' + escapeHtml(labelTxt) + '</span>';
      }).join('');
    } else {
      legendEl.style.display = 'none';
      legendEl.innerHTML = '';
    }

    // 区分別の面積・割合表示
    var bdEl = document.getElementById('sectionBreakdown');
    if (numSections > 1) {
      bdEl.style.display = 'block';

      var rawSumSec = bldgSecRawAreas.reduce(function(a, b) { return a + b; }, 0);
      var maxSecArea = 0;
      var maxSecIdx = -1;
      for (var s = 0; s < numSections; s++) {
        if (bldgSecRawAreas[s] > maxSecArea + 1e-6) {
          maxSecArea = bldgSecRawAreas[s];
          maxSecIdx = s;
        }
      }

      var isMultiFloor = curBldg.floors.length > 1;
      var html = '<div class="sec-bd-title">' +
        '<span>構造・屋根区分別の面積・割合（' + modeText + '）</span>' +
        '<span>不動産登記判定用</span>' +
        '</div>' +
        '<div class="split-mode-bar">' +
          '<span>区分境界線:</span>' +
          '<button type="button" class="split-btn' + (splitMode === 'straight' ? ' active' : '') + '" data-split="straight">直線</button>' +
          '<button type="button" class="split-btn' + (splitMode === 'vh' ? ' active' : '') + '" data-split="vh">縦→横(L字)</button>' +
          '<button type="button" class="split-btn' + (splitMode === 'hv' ? ' active' : '') + '" data-split="hv">横→縦(L字)</button>' +
        '</div>';

      curBldg.sections.forEach(function(sec, sIdx) {
        var color = SEC_COLORS[sIdx % SEC_COLORS.length];
        var numBadge = CIRCLED_NUMS[sIdx] || (sIdx + 1);
        var sTotalFloored = bldgSecFlooredAreas[sIdx] || 0;
        var sTotalRaw = bldgSecRawAreas[sIdx] || 0;
        var totalPct = (rawSumSec > 0.0001) ? (sTotalRaw / rawSumSec * 100) : 0;

        var sFloorArea = currentFloorData.secAreas[sIdx] || 0;
        var floorPct = (currentFloorData.rawArea > 0.0001) ? (sFloorArea / currentFloorData.rawArea * 100) : 0;

        var titleParts = [];
        if (sec.structure) titleParts.push(sec.structure);
        if (sec.roof) titleParts.push(sec.roof);
        var titleStr = titleParts.length > 0 ? titleParts.join(' / ') : '未設定';
        var noteHtml = sec.note ? '<div class="sec-bd-sub">メモ: ' + escapeHtml(sec.note) + '</div>' : '';
        var mainTagHtml = (sIdx === maxSecIdx && maxSecArea > 0.001)
          ? '<span class="sec-bd-main-tag">主たる部分</span>'
          : '';

        var floorSubHtml = isMultiFloor
          ? '<div class="sec-bd-floor-sub">' + escapeHtml(currentFloorData.name) + ': ' + floorArea2(sFloorArea).toFixed(2) + '㎡ (' + floorPct.toFixed(1) + '%)</div>'
          : '';

        html += '<div class="sec-bd-row">' +
          '<div class="sec-bd-left">' +
            '<span class="sec-bd-badge" style="background:' + color + ';">' + numBadge + '</span>' +
            '<div>' +
              '<div class="sec-bd-name">' + escapeHtml(titleStr) + mainTagHtml + '</div>' +
              noteHtml +
            '</div>' +
          '</div>' +
          '<div class="sec-bd-right">' +
            '<div><span class="sec-bd-area">' + sTotalFloored.toFixed(2) + ' ㎡</span>' +
            '<span class="sec-bd-ratio">(' + totalPct.toFixed(1) + '%)</span></div>' +
            floorSubHtml +
          '</div>' +
        '</div>';
      });

      bdEl.innerHTML = html;
      bdEl.querySelectorAll('.split-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          setSplitMode(btn.getAttribute('data-split'));
        });
      });
    } else {
      bdEl.style.display = 'none';
      bdEl.innerHTML = '';
    }

    drawCanvas(curBldg, currentFloorData, firstFloorData, isCenter);
  }

  function drawCanvas(curBldg, curData, firstData, isCenter) {
    var canvas = document.getElementById('viewCanvas');
    var ctx = canvas.getContext('2d');
    var dpr = window.devicePixelRatio || 1;
    var rect = canvas.getBoundingClientRect();
    var W = rect.width || canvas.clientWidth || 320;
    var H = rect.height || canvas.clientHeight || 370;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.scale(dpr, dpr);

    ctx.clearRect(0, 0, W, H);

    var pts = curData.activePts;
    if (pts.length < 2) return;

    var bMinX = Infinity, bMaxX = -Infinity, bMinY = Infinity, bMaxY = -Infinity;
    var expandBldgBounds = function(p) {
      if (p.x < bMinX) bMinX = p.x;
      if (p.x > bMaxX) bMaxX = p.x;
      if (p.y < bMinY) bMinY = p.y;
      if (p.y > bMaxY) bMaxY = p.y;
    };
    pts.forEach(expandBldgBounds);
    if (isCenter && curData.outer && curData.outer.pts) {
      curData.outer.pts.forEach(expandBldgBounds);
    }
    var show1F = (currentFloorIdx > 0 && document.getElementById('showFirstFloor').checked);
    if (show1F) firstData.activePts.forEach(expandBldgBounds);

    var bldgSpan = Math.max(bMaxX - bMinX, bMaxY - bMinY, 2.0);
    var maxVisualExt = bldgSpan * 0.42;

    var minX = bMinX, maxX = bMaxX, minY = bMinY, maxY = bMaxY;
    var expandAllBounds = function(p) {
      if (p.x < minX) minX = p.x;
      if (p.x > maxX) maxX = p.x;
      if (p.y < minY) minY = p.y;
      if (p.y > maxY) maxY = p.y;
    };

    var visualExts = curData.extLines.map(function(ext) {
      var isTruncated = ext.dist > maxVisualExt && ext.dist > 1.5;
      var drawDist = isTruncated ? maxVisualExt : ext.dist;
      var endPt = {
        x: ext.basePt.x + ext.ux * drawDist,
        y: ext.basePt.y + ext.uy * drawDist
      };
      expandAllBounds(ext.basePt);
      expandAllBounds(endPt);
      return {
        basePt: ext.basePt,
        endPt: endPt,
        ux: ext.ux,
        uy: ext.uy,
        actualDist: ext.dist,
        isTruncated: isTruncated
      };
    });

    var pad = isPreviewPinned ? 44 : 58;
    var rangeX = (maxX - minX) || 1;
    var rangeY = (maxY - minY) || 1;
    var baseScale = Math.min((W - pad * 2) / rangeX, (H - pad * 2) / rangeY);
    var scale = baseScale * camZoom;

    var centerX = (minX + maxX) / 2;
    var centerY = (minY + maxY) / 2;

    var toScreen = function(x, y) {
      return {
        x: (W / 2) + (x - centerX) * scale + camPanX,
        y: (H / 2) + (y - centerY) * scale + camPanY
      };
    };

    // 0. 1m方眼グリッド背景
    if (scale >= 8) {
      ctx.save();
      ctx.strokeStyle = '#f1f5f9';
      ctx.lineWidth = 1;
      var worldLeft = centerX - ((W / 2) + camPanX) / scale;
      var worldRight = centerX + ((W / 2) - camPanX) / scale;
      var worldTop = centerY - ((H / 2) + camPanY) / scale;
      var worldBottom = centerY + ((H / 2) - camPanY) / scale;

      for (var gx = Math.floor(worldLeft); gx <= Math.ceil(worldRight); gx++) {
        var sx = toScreen(gx, 0).x;
        ctx.beginPath();
        ctx.moveTo(sx, 0);
        ctx.lineTo(sx, H);
        ctx.stroke();
      }
      for (var gy = Math.floor(worldTop); gy <= Math.ceil(worldBottom); gy++) {
        var sy = toScreen(0, gy).y;
        ctx.beginPath();
        ctx.moveTo(0, sy);
        ctx.lineTo(W, sy);
        ctx.stroke();
      }
      ctx.restore();
    }

    // 1. 1階ガイド線
    if (show1F && firstData.activePts.length > 1) {
      ctx.save();
      ctx.beginPath();
      firstData.activePts.forEach(function(p, i) {
        var sp = toScreen(p.x, p.y);
        if (i === 0) ctx.moveTo(sp.x, sp.y);
        else ctx.lineTo(sp.x, sp.y);
      });
      ctx.setLineDash([2, 3]);
      ctx.strokeStyle = '#94a3b8';
      ctx.lineWidth = 1.0;
      ctx.stroke();
      ctx.restore();
    }

    // 2. 壁芯表示時の実測寸法（外法）破線
    if (isCenter && curData.outer && curData.outer.pts.length > 1) {
      ctx.save();
      ctx.beginPath();
      curData.outer.pts.forEach(function(p, i) {
        var sp = toScreen(p.x, p.y);
        if (i === 0) ctx.moveTo(sp.x, sp.y);
        else ctx.lineTo(sp.x, sp.y);
      });
      ctx.setLineDash([4, 3]);
      ctx.strokeStyle = '#60a5fa';
      ctx.lineWidth = 1.0;
      ctx.stroke();
      ctx.restore();
    }

    // 3. 建物ポリゴン塗りつぶし
    var defaultColor = isCenter ? '#ea580c' : '#2563eb';
    var fillColor = isCenter ? 'rgba(234, 88, 12, 0.08)' : 'rgba(37, 99, 235, 0.08)';
    if (curData.outer.totalLen > 0.001 && curData.outer.isClosed && !curData.outer.geomCheck.hasError) {
      ctx.save();
      ctx.beginPath();
      pts.forEach(function(p, i) {
        var sp = toScreen(p.x, p.y);
        if (i === 0) ctx.moveTo(sp.x, sp.y);
        else ctx.lineTo(sp.x, sp.y);
      });
      ctx.fillStyle = fillColor;
      ctx.fill();
      ctx.restore();
    }

    // 3.5 構造・屋根の区分境界線（紫破線で面積分割ラインを明示）
    var hasMultipleSecs = curBldg.sections.length > 1;
    if (hasMultipleSecs && curData.bridges && curData.bridges.length > 0) {
      ctx.save();
      ctx.setLineDash([4, 3]);
      ctx.strokeStyle = '#7c3aed';
      ctx.lineWidth = 1.3;
      curData.bridges.forEach(function(bLine) {
        if (bLine.length < 2) return;
        ctx.beginPath();
        bLine.forEach(function(bp, bIdx) {
          var sp = toScreen(bp.x, bp.y);
          if (bIdx === 0) ctx.moveTo(sp.x, sp.y);
          else ctx.lineTo(sp.x, sp.y);
        });
        ctx.stroke();
      });
      ctx.restore();
    }

    // 統合障害物リスト（離れ・建物線・始点・各ラベル同士の衝突を完全回避）
    var obstacleBoxes = [];
    function isBoxOverlapping(box) {
      for (var k = 0; k < obstacleBoxes.length; k++) {
        var b = obstacleBoxes[k];
        if (box.x1 < b.x2 && box.x2 > b.x1 && box.y1 < b.y2 && box.y2 > b.y1) {
          return true;
        }
      }
      return false;
    }

    // 建物の辺そのものを細い障害物として登録（文字が辺を跨がないようにする）
    var screenSegs = [];
    for (var i = 0; i < pts.length - 1; i++) {
      var sp1 = toScreen(pts[i].x, pts[i].y);
      var sp2 = toScreen(pts[i + 1].x, pts[i + 1].y);
      screenSegs.push({ p1: sp1, p2: sp2 });
    }

    // 4. 辺の延長線（離れ）を先に描画し、そのテキスト・記号・線を障害物登録
    if (visualExts.length > 0) {
      ctx.save();
      visualExts.forEach(function(ext) {
        var bp = toScreen(ext.basePt.x, ext.basePt.y);
        var ep = toScreen(ext.endPt.x, ext.endPt.y);

        ctx.beginPath();
        ctx.moveTo(bp.x, bp.y);
        ctx.lineTo(ep.x, ep.y);
        ctx.setLineDash([3, 3]);
        ctx.strokeStyle = '#ef4444';
        ctx.lineWidth = 1.3;
        ctx.stroke();

        // 離れ線の経路を障害物として登録
        var steps = Math.max(2, Math.ceil(Math.hypot(ep.x - bp.x, ep.y - bp.y) / 14));
        for (var st = 0; st <= steps; st++) {
          var t = st / steps;
          var px = bp.x + (ep.x - bp.x) * t;
          var py = bp.y + (ep.y - bp.y) * t;
          obstacleBoxes.push({ x1: px - 5, x2: px + 5, y1: py - 5, y2: py + 5 });
        }

        if (ext.isTruncated) {
          var sx = (bp.x + ep.x) * 0.45;
          var sy = (bp.y + ep.y) * 0.45;
          var vx = ep.x - bp.x;
          var vy = ep.y - bp.y;
          var sl = Math.hypot(vx, vy) || 1;
          var ux = vx / sl;
          var uy = vy / sl;
          var px = -uy;
          var py = ux;

          ctx.setLineDash([]);
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(sx, sy, 5, 0, Math.PI * 2);
          ctx.fill();

          ctx.strokeStyle = '#ef4444';
          ctx.lineWidth = 1.3;
          [-2.2, 2.2].forEach(function(shift) {
            var cx = sx + ux * shift;
            var cy = sy + uy * shift;
            ctx.beginPath();
            ctx.moveTo(cx - px * 5 + ux * 2, cy - py * 5 + uy * 2);
            ctx.lineTo(cx + px * 5 - ux * 2, cy + py * 5 - uy * 2);
            ctx.stroke();
          });
          obstacleBoxes.push({ x1: sx - 8, x2: sx + 8, y1: sy - 8, y2: sy + 8 });
        }

        ctx.setLineDash([]);
        ctx.fillStyle = '#dc2626';
        ctx.beginPath();
        ctx.arc(ep.x, ep.y, 3.5, 0, Math.PI * 2);
        ctx.fill();

        var mx = (bp.x + ep.x) / 2;
        var my = (bp.y + ep.y) / 2;
        var label = formatSetbackFloor1(ext.actualDist) + (isCenter ? '(芯)' : '');

        ctx.font = 'bold 11.5px sans-serif';
        var tw = ctx.measureText(label).width;
        ctx.lineJoin = 'round';
        ctx.lineWidth = 3.5;
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.96)';
        ctx.fillStyle = '#dc2626';

        var isHorizontal = Math.abs(ep.x - bp.x) >= Math.abs(ep.y - bp.y);
        if (isHorizontal) {
          ctx.textAlign = 'center';
          ctx.textBaseline = 'bottom';
          var drawX = Math.max(24, Math.min(W - 24, mx));
          var drawY = my - 6;
          ctx.strokeText(label, drawX, drawY);
          ctx.fillText(label, drawX, drawY);
          obstacleBoxes.push({
            x1: drawX - tw / 2 - 4,
            x2: drawX + tw / 2 + 4,
            y1: drawY - 15,
            y2: drawY + 2
          });
        } else {
          ctx.textAlign = 'left';
          ctx.textBaseline = 'middle';
          var drawX = Math.min(W - 44, mx + 7);
          var drawY = my;
          ctx.strokeText(label, drawX, drawY);
          ctx.fillText(label, drawX, drawY);
          obstacleBoxes.push({
            x1: drawX - 3,
            x2: drawX + tw + 4,
            y1: drawY - 8,
            y2: drawY + 8
          });
        }
      });
      ctx.restore();
    }

    // 5. 始点・終点マーカーを先に描画して障害物登録
    var startSp = toScreen(pts[0].x, pts[0].y);
    ctx.save();
    ctx.fillStyle = '#16a34a';
    ctx.beginPath();
    ctx.arc(startSp.x, startSp.y, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.font = 'bold 10px sans-serif';
    ctx.fillStyle = '#15803d';
    ctx.fillText('S', startSp.x - 10, startSp.y - 5);
    ctx.restore();
    obstacleBoxes.push({ x1: startSp.x - 13, x2: startSp.x + 6, y1: startSp.y - 15, y2: startSp.y + 6 });

    var endSp = toScreen(pts[pts.length - 1].x, pts[pts.length - 1].y);
    if (curData.outer.totalLen > 0.001 && !curData.outer.isClosed) {
      ctx.fillStyle = '#dc2626';
      ctx.beginPath();
      ctx.arc(endSp.x, endSp.y, 4.5, 0, Math.PI * 2);
      ctx.fill();
    }

    // 外側法線判定用の符号付き面積計算
    var signedArea2 = 0;
    for (var i = 0; i < pts.length - 1; i++) {
      signedArea2 += (pts[i].x * pts[i + 1].y - pts[i + 1].x * pts[i].y);
    }
    var outSign = (signedArea2 >= 0) ? 1 : -1;

    // 6. 各辺の描画 ＋ 衝突完全回避寸法ラベル
    var secMidPoints = curBldg.sections.map(function() { return []; });

    for (var i = 0; i < pts.length - 1; i++) {
      var p1 = pts[i];
      var p2 = pts[i + 1];
      var sp1 = screenSegs[i].p1;
      var sp2 = screenSegs[i].p2;

      var edge = curData.edges[i];
      var sIdx = edge ? Math.min(edge.secIdx || 0, curBldg.sections.length - 1) : 0;
      var strokeColor = hasMultipleSecs ? SEC_COLORS[sIdx % SEC_COLORS.length] : defaultColor;

      ctx.save();
      ctx.beginPath();
      ctx.moveTo(sp1.x, sp1.y);
      ctx.lineTo(sp2.x, sp2.y);
      ctx.strokeStyle = strokeColor;
      ctx.lineWidth = 1.6;
      ctx.stroke();
      ctx.restore();

      var segLen = Math.hypot(p2.x - p1.x, p2.y - p1.y);
      if (segLen >= 0.01) {
        var mx = (sp1.x + sp2.x) / 2;
        var my = (sp1.y + sp2.y) / 2;
        secMidPoints[sIdx].push({ x: mx, y: my });

        var svx = sp2.x - sp1.x;
        var svy = sp2.y - sp1.y;
        var slen = Math.hypot(svx, svy) || 1;
        var sux = svx / slen;
        var suy = svy / slen;
        var outNx = suy * outSign;
        var outNy = -sux * outSign;

        ctx.save();
        ctx.font = 'bold 10.5px sans-serif';
        var prefix = hasMultipleSecs ? ((CIRCLED_NUMS[sIdx] || '') + (i + 1) + ':') : ('#' + (i + 1) + ':');
        var text = prefix + segLen.toFixed(3);
        var tw = ctx.measureText(text).width;
        var th = 13;

        // 外側オフセット＋接線スライド＋内側予備候補まで探索して重複ゼロの位置を決定
        var candidates = [
          { n: 13, t: 0 },
          { n: 25, t: 0 },
          { n: 13, t: 18 },
          { n: 13, t: -18 },
          { n: 37, t: 0 },
          { n: 25, t: 22 },
          { n: 25, t: -22 },
          { n: 49, t: 0 },
          { n: -14, t: 0 }
        ];

        var chosenX = mx + outNx * 13;
        var chosenY = my + outNy * 13;
        var chosenN = 13;

        for (var cIdx = 0; cIdx < candidates.length; cIdx++) {
          var cand = candidates[cIdx];
          var tx = mx + outNx * cand.n + sux * cand.t;
          var ty = my + outNy * cand.n + suy * cand.t;
          // 画面端からはみ出さないようクランプ
          tx = Math.max(tw / 2 + 4, Math.min(W - tw / 2 - 4, tx));
          ty = Math.max(10, Math.min(H - 10, ty));

          var box = {
            x1: tx - tw / 2 - 2,
            x2: tx + tw / 2 + 2,
            y1: ty - th / 2 - 1,
            y2: ty + th / 2 + 1
          };
          if (!isBoxOverlapping(box)) {
            chosenX = tx;
            chosenY = ty;
            chosenN = Math.abs(cand.n);
            obstacleBoxes.push(box);
            break;
          }
          if (cIdx === candidates.length - 1) {
            chosenX = tx;
            chosenY = ty;
            chosenN = Math.abs(cand.n);
            obstacleBoxes.push(box);
          }
        }

        if (chosenN >= 24) {
          ctx.beginPath();
          ctx.moveTo(mx, my);
          ctx.lineTo(chosenX, chosenY);
          ctx.strokeStyle = 'rgba(100, 116, 139, 0.5)';
          ctx.lineWidth = 0.8;
          ctx.stroke();
        }

        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.lineJoin = 'round';
        ctx.lineWidth = 3.5;
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.95)';
        ctx.strokeText(text, chosenX, chosenY);

        ctx.fillStyle = strokeColor;
        ctx.fillText(text, chosenX, chosenY);
        ctx.restore();
      }
    }

    // 7. 図中の区分バッジはコンパクトな丸番号のみ表示（詳細はキャンバス上部の凡例バーへ）
    if (hasMultipleSecs) {
      ctx.save();
      ctx.font = 'bold 11px sans-serif';
      curBldg.sections.forEach(function(sec, sIdx) {
        var mPts = secMidPoints[sIdx];
        if (mPts.length === 0) return;
        var avgX = mPts.reduce(function(acc, p) { return acc + p.x; }, 0) / mPts.length;
        var avgY = mPts.reduce(function(acc, p) { return acc + p.y; }, 0) / mPts.length;

        var shortBadge = CIRCLED_NUMS[sIdx] || String(sIdx + 1);
        var bgCol = SEC_COLORS[sIdx % SEC_COLORS.length];

        ctx.fillStyle = bgCol;
        ctx.beginPath();
        ctx.arc(avgX, avgY, 10, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(shortBadge, avgX, avgY + 0.5);
      });
      ctx.restore();
    }
  }

  renderAll();
});
</script>
